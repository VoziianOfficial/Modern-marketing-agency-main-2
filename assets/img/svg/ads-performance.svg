    </desc>

    <style>
        .np-float-a {
            animation: npFloatA 7s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: center;
        }

        .np-float-b {
            animation: npFloatB 9s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: center;
        }

        .np-pulse {
            animation: npPulse 4.8s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .np-dash {
            stroke-dasharray: 8 11;
            animation: npDash 14s linear infinite;
        }

        .np-dash-reverse {
            stroke-dasharray: 6 10;
            animation: npDashReverse 17s linear infinite;
        }

        @keyframes npFloatA {
            from {
                transform: translateY(-4px);
            }

            to {
                transform: translateY(9px);
            }
        }

        @keyframes npFloatB {
            from {
                transform: translateY(7px);
            }

            to {
                transform: translateY(-8px);
            }
        }

        @keyframes npPulse {
            0%,
            100% {
                opacity: .42;
                transform: scale(.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        @keyframes npDash {
            to {
                stroke-dashoffset: -190;
            }
        }

        @keyframes npDashReverse {
            to {
                stroke-dashoffset: 190;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .np-float-a,
            .np-float-b,
            .np-pulse,
            .np-dash,
            .np-dash-reverse {
                animation: none;
            }
        }
    </style>


    

