<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 760 560"
    width="760"
    height="560"
    fill="none"
    role="img"
    aria-labelledby="robotMarqueeTitle robotMarqueeDesc"
>
    <title id="robotMarqueeTitle">Marketing robot illustration</title>
    <desc id="robotMarqueeDesc">
        Large premium robot illustration for a marketing agency section,
        styled with navy, white, carrot and lilac accents.
    </desc>

    <style>
        .rm-float-a {
            animation: rmFloatA 6.5s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: center;
        }

        .rm-float-b {
            animation: rmFloatB 8.5s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: center;
        }

        .rm-pulse {
            animation: rmPulse 4.5s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .rm-orbit {
            animation: rmRotate 20s linear infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .rm-orbit-reverse {
            animation: rmRotateReverse 26s linear infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        @keyframes rmFloatA {
            from { transform: translateY(-6px); }
            to   { transform: translateY(10px); }
        }

        @keyframes rmFloatB {
            from { transform: translateY(7px); }
            to   { transform: translateY(-8px); }
        }

        @keyframes rmPulse {
            0%, 100% {
                opacity: .45;
                transform: scale(.92);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        @keyframes rmRotate {
            to { transform: rotate(360deg); }
        }

        @keyframes rmRotateReverse {
            to { transform: rotate(-360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .rm-float-a,
            .rm-float-b,
            .rm-pulse,
            .rm-orbit,
            .rm-orbit-reverse {
                animation: none;
            }
        }
    </style>


    

