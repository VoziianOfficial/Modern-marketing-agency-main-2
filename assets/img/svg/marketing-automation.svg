    <title id="marketingAutomationTitle">Marketing automation illustration</title>
    <desc id="marketingAutomationDesc">
        Marketing automation system connecting advertising data,
        CRM, reporting, campaign alerts and optimization.
    </desc>

    <style>
        .ma-float-a {
            animation: maFloatA 7s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: center;
        }

        .ma-float-b {
            animation: maFloatB 9s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: center;
        }

        .ma-float-c {
            animation: maFloatC 11s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: center;
        }

        .ma-pulse {
            animation: maPulse 4.4s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .ma-flow {
            stroke-dasharray: 7 10;
            animation: maFlow 13s linear infinite;
        }

        .ma-flow-reverse {
            stroke-dasharray: 6 9;
            animation: maFlowReverse 16s linear infinite;
        }

        .ma-spin {
            animation: maSpin 21s linear infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .ma-spin-reverse {
            animation: maSpinReverse 27s linear infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        @keyframes maFloatA {
            from {
                transform: translateY(-5px);
            }

            to {
                transform: translateY(9px);
            }
        }

        @keyframes maFloatB {
            from {
                transform: translateY(7px);
            }

            to {
                transform: translateY(-8px);
            }
        }

        @keyframes maFloatC {
            from {
                transform: translateY(-3px);
            }

            to {
                transform: translateY(6px);
            }
        }

        @keyframes maPulse {
            0%,
            100% {
                opacity: .4;
                transform: scale(.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        @keyframes maFlow {
            to {
                stroke-dashoffset: -190;
            }
        }

        @keyframes maFlowReverse {
            to {
                stroke-dashoffset: 190;
            }
        }

        @keyframes maSpin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes maSpinReverse {
            to {
                transform: rotate(-360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .ma-float-a,
            .ma-float-b,
            .ma-float-c,
            .ma-pulse,
            .ma-flow,
            .ma-flow-reverse,
            .ma-spin,
            .ma-spin-reverse {
                animation: none;
            }
        }
    </style>


    

