    role="img"
    aria-labelledby="conversionFunnelTitle conversionFunnelDesc"
>
    <title id="conversionFunnelTitle">Conversion funnel illustration</title>
    <desc id="conversionFunnelDesc">
        Performance marketing conversion funnel showing advertising traffic,
        filtering, qualified leads, CRM and business outcomes.
    </desc>

    <style>
        .cf-float-a {
            animation: cfFloatA 7s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: center;
        }

        .cf-float-b {
            animation: cfFloatB 9s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: center;
        }

        .cf-pulse {
            animation: cfPulse 4.5s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .cf-flow {
            stroke-dasharray: 7 10;
            animation: cfFlow 12s linear infinite;
        }

        .cf-flow-reverse {
            stroke-dasharray: 5 9;
            animation: cfFlowReverse 15s linear infinite;
        }

        .cf-rotate {
            animation: cfRotate 18s linear infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        @keyframes cfFloatA {
            from {
                transform: translateY(-5px);
            }

            to {
                transform: translateY(9px);
            }
        }

        @keyframes cfFloatB {
            from {
                transform: translateY(8px);
            }

            to {
                transform: translateY(-7px);
            }
        }

        @keyframes cfPulse {
            0%,
            100% {
                opacity: .45;
                transform: scale(.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        @keyframes cfFlow {
            to {
                stroke-dashoffset: -180;
            }
        }

        @keyframes cfFlowReverse {
            to {
                stroke-dashoffset: 180;
            }
        }

        @keyframes cfRotate {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .cf-float-a,
            .cf-float-b,
            .cf-pulse,
            .cf-flow,
            .cf-flow-reverse,
            .cf-rotate {
                animation: none;
            }
        }
    </style>


    

