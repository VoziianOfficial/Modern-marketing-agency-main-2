    <title id="dataAnalyticsTitle">Data analytics illustration</title>
    <desc id="dataAnalyticsDesc">
        Performance analytics dashboard with campaign metrics,
        charts, conversion signals and reporting cards.
    </desc>

    <style>
        .da-float-a {
            animation: daFloatA 7s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: center;
        }

        .da-float-b {
            animation: daFloatB 9s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: center;
        }

        .da-pulse {
            animation: daPulse 4.5s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .da-path {
            stroke-dasharray: 7 10;
            animation: daPath 13s linear infinite;
        }

        .da-path-reverse {
            stroke-dasharray: 6 9;
            animation: daPathReverse 15s linear infinite;
        }

        .da-bar-a {
            animation: daBarA 5.5s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: bottom;
        }

        .da-bar-b {
            animation: daBarB 6.5s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: bottom;
        }

        @keyframes daFloatA {
            from {
                transform: translateY(-5px);
            }

            to {
                transform: translateY(9px);
            }
        }

        @keyframes daFloatB {
            from {
                transform: translateY(7px);
            }

            to {
                transform: translateY(-8px);
            }
        }

        @keyframes daPulse {
            0%,
            100% {
                opacity: .42;
                transform: scale(.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        @keyframes daPath {
            to {
                stroke-dashoffset: -190;
            }
        }

        @keyframes daPathReverse {
            to {
                stroke-dashoffset: 190;
            }
        }

        @keyframes daBarA {
            from {
                transform: scaleY(.78);
            }

            to {
                transform: scaleY(1);
            }
        }

        @keyframes daBarB {
            from {
                transform: scaleY(1);
            }

            to {
                transform: scaleY(.72);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .da-float-a,
            .da-float-b,
            .da-pulse,
            .da-path,
            .da-path-reverse,
            .da-bar-a,
            .da-bar-b {
                animation: none;
            }
        }
    </style>


    

